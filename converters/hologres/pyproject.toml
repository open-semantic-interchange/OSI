[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.26.0",
]
# Only needed to run the env-gated live tests against a real Hologres instance.
# Deliberately excluded from `default-groups` so CI never installs a database
# driver it cannot use.
live = [
    "psycopg[binary]>=3.2",
]

[project]
name = "apache-ossie-hologres"
version = "0.2.0.dev0"
description = "Alibaba Cloud Hologres Semantic View <> Apache Ossie converter"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "Open Semantic Interchange",
    "Hologres",
    "semantic view",
]
dependencies = [
    "PyYAML>=6.0",
    "sqlglot>=30.12.0",
]

[project.scripts]
ossie-hologres = "ossie_hologres.cli:main"

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie/"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_hologres"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a reachable Hologres instance (skipped unless HOLOGRES_* env vars are set)",
]

[tool.uv]
required-version = ">=0.9.0"
default-groups = [
    "dev"
]
