[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.0",
    "ruff>=0.11.5",
]

[project]
name = "apache-ossie-microsoft"
version = "0.2.0.dev0"
description = "Converter between Microsoft Power BI / Fabric semantic models (TMSL) and Apache Ossie semantic models"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "Power BI",
    "Fabric",
    "TMSL",
    "TMDL",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
ossie-microsoft = "cli:main"

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie/"

[tool.hatch.build.targets.wheel]
packages = [
    "src/_common.py",
    "src/cli.py",
    "src/ossie_microsoft.py",
    "src/ossie_to_semantic_model.py",
    "src/semantic_model_to_ossie.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W", "B", "A", "C4", "PIE", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Most tests convert deliberately lossy models, so the report is expected noise here.
# The guarantee that a *lossless* conversion is silent is not weakened by this: the
# tests that assert it turn warnings into errors themselves, locally and explicitly.
filterwarnings = ["ignore::UserWarning"]

[tool.coverage.run]
branch = true
source = [
    "_common",
    "cli",
    "ossie_microsoft",
    "ossie_to_semantic_model",
    "semantic_model_to_ossie",
]

[tool.coverage.report]
# The converter's contract is that every lossy branch reports itself. An
# unexercised branch is an unproven warning, so the bar is high deliberately.
fail_under = 95
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.uv]
required-version = ">=0.9.0"
default-groups = [
    "dev"
]
