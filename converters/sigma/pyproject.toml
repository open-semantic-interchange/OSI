[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project]
name = "apache-ossie-sigma"
version = "0.2.0.dev0"
description = "Sigma Computing Data Model <> Apache Ossie converter"
authors = [{ name = "Apache Software Foundation", email = "dev@ossie.apache.org" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "Apache Ossie",
    "Ossie",
    "Sigma",
    "Sigma Computing"
]
dependencies = [
    "apache-ossie>=0.2.0.dev0",
    "PyYAML>=6.0",
    "sqlglot>=20.0",
]

[project.scripts]
ossie-sigma = "ossie_sigma.cli:main"

[project.urls]
homepage = "https://ossie.apache.org/"
repository = "https://github.com/apache/ossie/"

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_sigma"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.0"
default-groups = [
    "dev"
]

# apache-ossie is not yet published to PyPI; resolve it from the in-repo
# package for now. Remove this block once apache-ossie is published to PyPI.
[tool.uv.sources]
apache-ossie = { path = "../../python", editable = true }
