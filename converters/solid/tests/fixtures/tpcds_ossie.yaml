# Expected output of `ossie-solid import -i tpcds_solid.yaml`. Regenerate with:
#   ossie-solid import -i tests/fixtures/tpcds_solid.yaml -o tests/fixtures/tpcds_ossie.yaml
# then re-add this header.
version: 0.2.0.dev0
version: 0.2.0.dev0
semantic_model:
- name: tpcds_retail_model
  description: 'TPC-DS retail semantic model for sales and customer analytics. Supports time-based

    analysis, customer segmentation, product performance, and store operations metrics.'
  ai_context:
    instructions: '- Always join through public.store_sales rather than aggregating a dimension on its
      own.

      - Revenue means store_sales.ss_ext_sales_price, not ss_sales_price, which is a per-unit figure.

      - Exclude rows where ss_sold_date_sk is null; those are unshipped orders.'
    examples:
    - What were total sales and net profit by month for the last four quarters?
    - Which brands drove the most revenue in the Electronics category?
    - How does sales per employee compare across stores in each state?
  datasets:
  - name: store_sales
    source: tpcds.public.store_sales
    primary_key:
    - ss_item_sk
    - ss_ticket_number
    description: Fact table containing all store sales transactions, one row per line item.
    ai_context:
      instructions: Grain is (ss_item_sk, ss_ticket_number). Loaded nightly from the POS extract.
      synonyms:
      - sales transactions
      - store purchases
      - retail sales
      - POS data
    fields:
    - name: ss_sold_date_sk
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: ss_sold_date_sk
      description: Foreign key to the date dimension.
      datatype: Integer
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - sale date
        - transaction date
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    - name: ss_item_sk
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: ss_item_sk
      description: Foreign key to the item dimension.
      datatype: Integer
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - product
        - item
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    - name: ss_ticket_number
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: ss_ticket_number
      description: Ticket number identifying the sale the line item belongs to.
      datatype: Integer
      dimension:
        is_time: false
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    - name: ss_customer_sk
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: ss_customer_sk
      description: Foreign key to the customer dimension.
      datatype: Integer
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - customer
        - buyer
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    - name: ss_store_sk
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: ss_store_sk
      description: Foreign key to the store dimension.
      datatype: Integer
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - store
        - location
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    - name: ss_sold_at
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: ss_sold_at
      description: Wall-clock time the sale was rung up, in the store's local time.
      datatype: DateTime
      dimension:
        is_time: true
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TIMESTAMP_NTZ"}'
    - name: ss_quantity
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: ss_quantity
      description: Quantity of items sold.
      datatype: Integer
      ai_context:
        synonyms:
        - units sold
        - quantity
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    - name: ss_sales_price
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: ss_sales_price
      description: Sales price per unit.
      datatype: Decimal
      ai_context:
        instructions: Per-unit price. Use ss_ext_sales_price for line revenue.
        synonyms:
        - unit price
        - price
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(7,2)"}'
    - name: ss_ext_sales_price
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: ss_ext_sales_price
      description: Extended sales price (quantity * price).
      datatype: Decimal
      ai_context:
        synonyms:
        - total price
        - line total
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(7,2)"}'
    - name: ss_net_profit
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: ss_net_profit
      description: Net profit from the sale.
      datatype: Decimal
      ai_context:
        synonyms:
        - profit
        - margin
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(7,2)"}'
    - name: ss_discount_pct
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: 1 - (ss_sales_price / NULLIF(ss_list_price, 0))
      description: Discount applied to the line, as a fraction of list price.
      ai_context:
        synonyms:
        - discount rate
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "role": "metric"}'
    custom_extensions:
    - vendor_name: SOLID
      data: '{"_v": 1, "quality_rank": "high", "indexes": ["ss_sold_date_sk", "ss_customer_sk"]}'
  - name: date_dim
    source: tpcds.public.date_dim
    primary_key:
    - d_date_sk
    description: Date dimension with calendar attributes.
    ai_context:
      synonyms:
      - calendar
      - dates
      - time periods
    fields:
    - name: d_date_sk
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: d_date_sk
      description: Surrogate key for date.
      datatype: Integer
      dimension:
        is_time: false
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    - name: d_date
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: d_date
      description: Calendar date.
      datatype: Date
      dimension:
        is_time: true
      ai_context:
        synonyms:
        - date
        - day
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "DATE"}'
    - name: d_year
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: d_year
      description: Calendar year.
      datatype: Integer
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - year
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)", "sample_values": ["2022", "2023", "2024"]}'
    - name: d_quarter_name
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: d_quarter_name
      description: Quarter name, for example 2024Q1.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - quarter
        - fiscal quarter
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT", "sample_values": ["2024Q1", "2024Q2"]}'
    - name: d_month_name
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: d_month_name
      description: Month name.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - month
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    custom_extensions:
    - vendor_name: SOLID
      data: '{"_v": 1, "quality_rank": "high"}'
  - name: customer
    source: tpcds.public.customer
    primary_key:
    - c_customer_sk
    description: Customer dimension with demographic information.
    ai_context:
      synonyms:
      - customers
      - shoppers
      - buyers
    fields:
    - name: c_customer_sk
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: c_customer_sk
      description: Surrogate key for customer.
      datatype: Integer
      dimension:
        is_time: false
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    - name: c_customer_id
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: c_customer_id
      description: Business key for customer.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - customer ID
        - customer number
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    - name: c_first_name
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: c_first_name
      description: Customer first name.
      datatype: String
      dimension:
        is_time: false
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    - name: c_last_name
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: c_last_name
      description: Customer last name.
      datatype: String
      dimension:
        is_time: false
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    - name: c_email_address
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: c_email_address
      description: Customer email address.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        instructions: Nullable. Roughly 12% of rows have no email on file.
        synonyms:
        - email
        - contact
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    - name: c_preferences
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: c_preferences
      description: Semi-structured marketing preference document.
      datatype: Opaque
      dimension:
        is_time: false
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "VARIANT"}'
    custom_extensions:
    - vendor_name: SOLID
      data: '{"_v": 1, "quality_rank": "mediocre"}'
  - name: item
    source: tpcds.public.item
    primary_key:
    - i_item_sk
    description: Item dimension with product attributes.
    ai_context:
      synonyms:
      - products
      - items
      - merchandise
    fields:
    - name: i_item_sk
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: i_item_sk
      description: Surrogate key for item.
      datatype: Integer
      dimension:
        is_time: false
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    - name: i_item_id
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: i_item_id
      description: Business key for item.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - item ID
        - product ID
        - SKU
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    - name: i_item_desc
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: i_item_desc
      description: Item description.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - product description
        - item name
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    - name: i_brand
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: i_brand
      description: Brand name.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - brand
        - manufacturer
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    - name: i_category
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: i_category
      description: Item category.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - product category
        - department
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT", "sample_values": ["Electronics", "Home", "Sports"]}'
    - name: i_current_price
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: i_current_price
      description: Current price of the item.
      datatype: Decimal
      ai_context:
        synonyms:
        - price
        - list price
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(7,2)"}'
    custom_extensions:
    - vendor_name: SOLID
      data: '{"_v": 1, "quality_rank": "high"}'
  - name: store
    source: tpcds.public.store
    primary_key:
    - s_store_sk
    description: Store dimension with location and store attributes.
    ai_context:
      synonyms:
      - stores
      - retail locations
      - branches
    fields:
    - name: s_store_sk
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: s_store_sk
      description: Surrogate key for store.
      datatype: Integer
      dimension:
        is_time: false
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    - name: s_store_id
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: s_store_id
      description: Business key for store.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - store ID
        - store number
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    - name: s_store_name
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: s_store_name
      description: Store name.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - store name
        - location name
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    - name: s_city
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: s_city
      description: City where the store is located.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - city
        - location
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT"}'
    - name: s_state
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: s_state
      description: State where the store is located.
      datatype: String
      dimension:
        is_time: false
      ai_context:
        synonyms:
        - state
        - region
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "TEXT", "sample_values": ["CA", "NY", "TX"]}'
    - name: s_is_franchise
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: s_is_franchise
      description: Whether the location is franchise-operated.
      datatype: Boolean
      dimension:
        is_time: false
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "BOOLEAN"}'
    - name: s_number_employees
      expression:
        dialects:
        - dialect: SNOWFLAKE
          expression: s_number_employees
      description: Number of employees at the store.
      datatype: Integer
      ai_context:
        synonyms:
        - employee count
        - staff size
      custom_extensions:
      - vendor_name: SOLID
        data: '{"_v": 1, "type": "NUMBER(38,0)"}'
    custom_extensions:
    - vendor_name: SOLID
      data: '{"_v": 1, "quality_rank": "high"}'
  relationships:
  - name: store_sales_to_date_dim
    from: store_sales
    to: date_dim
    from_columns:
    - ss_sold_date_sk
    to_columns:
    - d_date_sk
    custom_extensions:
    - vendor_name: SOLID
      data: '{"_v": 1, "flipped": true}'
  - name: store_sales_to_customer
    from: store_sales
    to: customer
    from_columns:
    - ss_customer_sk
    to_columns:
    - c_customer_sk
  - name: store_sales_to_item
    from: store_sales
    to: item
    from_columns:
    - ss_item_sk
    to_columns:
    - i_item_sk
  - name: store_sales_to_store
    from: store_sales
    to: store
    from_columns:
    - ss_store_sk
    to_columns:
    - s_store_sk
  metrics:
  - name: TOTAL_SALES
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: SUM(store_sales.ss_ext_sales_price)
    description: Total sales revenue across all transactions.
    ai_context:
      synonyms:
      - total revenue
      - gross sales
      - sales amount
  - name: TOTAL_PROFIT
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: SUM(store_sales.ss_net_profit)
    description: Total net profit from store sales.
    ai_context:
      synonyms:
      - net profit
      - total earnings
  - name: TRANSACTION_COUNT
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: COUNT(DISTINCT store_sales.ss_ticket_number)
    description: Number of distinct sales tickets.
  - name: ROW_COUNT
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: COUNT(*)
    description: Row count, used as a denominator in coverage checks.
    custom_extensions:
    - vendor_name: SOLID
      data: '{"_v": 1, "tables": ["tpcds.public.store_sales"]}'
  - name: CUSTOMER_LIFETIME_VALUE
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: SUM(ss_ext_sales_price) / COUNT(DISTINCT c_customer_sk)
    description: 'Average lifetime sales value per customer. Spans two tables, so Solid stores the

      formula with bare column names and resolves them at query time.'
    ai_context:
      synonyms:
      - CLV
      - LTV
    custom_extensions:
    - vendor_name: SOLID
      data: '{"_v": 1, "tables": ["tpcds.public.store_sales", "tpcds.public.customer"]}'
  custom_extensions:
  - vendor_name: SOLID
    data: '{"_v": 1, "dialect": "SNOWFLAKE", "model_llm_description": "TPC-DS retail semantic model for
      sales and customer analytics. Supports time-based\nanalysis, customer segmentation, product performance,
      and store operations metrics.", "model_description": "Retail analytics for the TPC-DS benchmark
      schema: store sales transactions joined\nto their date, customer, item, and store dimensions.",
      "custom_instructions": "- Always join through @<assetlink id=''11111111-1111-4111-8111-111111111111''
      type=''table'' name=''public.store_sales''> rather than aggregating a dimension on its own.\n- Revenue
      means @<assetlink id=''22222222-2222-4222-8222-222222222222'' type=''column'' name=''store_sales.ss_ext_sales_price''>,
      not ss_sales_price, which is a per-unit figure.\n- Exclude rows where ss_sold_date_sk is null; those
      are unshipped orders.", "example_queries": [{"name": "Monthly revenue and profit", "description":
      "Revenue and profit by calendar month for the trailing twelve months.\n", "sql": "SELECT d.d_year,\n       d.d_month_name,\n       SUM(ss.ss_ext_sales_price)
      AS revenue,\n       SUM(ss.ss_net_profit)      AS profit\nFROM tpcds.public.store_sales ss\nJOIN
      tpcds.public.date_dim d ON d.d_date_sk = ss.ss_sold_date_sk\nWHERE d.d_date >= DATEADD(month, -12,
      CURRENT_DATE())\nGROUP BY 1, 2\nORDER BY 1, 2\n"}, {"name": "Sales per employee by state", "description":
      "Store productivity, ranked within each state.\n", "sql": "SELECT s.s_state,\n       s.s_store_name,\n       SUM(ss.ss_ext_sales_price)
      / NULLIF(MAX(s.s_number_employees), 0) AS sales_per_employee\nFROM tpcds.public.store_sales ss\nJOIN
      tpcds.public.store s ON s.s_store_sk = ss.ss_store_sk\nGROUP BY 1, 2\nORDER BY 1, 3 DESC\n"}], "benchmark_questions":
      [{"question": "What was total revenue in 2024Q1?", "is_enabled": true, "expected_sql": "SELECT SUM(ss.ss_ext_sales_price)
      AS revenue\nFROM tpcds.public.store_sales ss\nJOIN tpcds.public.date_dim d ON d.d_date_sk = ss.ss_sold_date_sk\nWHERE
      d.d_quarter_name = ''2024Q1''\n"}, {"question": "Which brand had the highest revenue in the Electronics
      category?", "is_enabled": false}]}'
