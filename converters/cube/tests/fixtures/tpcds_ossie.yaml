# The Ossie form of tpcds_cube/, asserted as a whole-document snapshot.
# Regenerate with: uv run ossie-cube import -i tests/fixtures/tpcds_cube

version: 0.2.0.dev0
semantic_model:
- name: tpcds_retail_model
  description: TPC-DS retail semantic model for sales and customer analytics
  ai_context:
    instructions: Use this semantic model for retail analytics. It provides comprehensive
      sales, customer, product, and store data from the TPC-DS benchmark. The model
      supports time-based analysis, customer segmentation, product performance, and
      store operations metrics.
  relationships:
  - name: store_sales_to_date_dim
    from: store_sales
    to: date_dim
    from_columns:
    - ss_sold_date_sk
    to_columns:
    - d_date_sk
  - name: store_sales_to_customer
    from: store_sales
    to: customer
    from_columns:
    - ss_customer_sk
    to_columns:
    - c_customer_sk
  - name: store_sales_to_item
    from: store_sales
    to: item
    from_columns:
    - ss_item_sk
    to_columns:
    - i_item_sk
  - name: store_sales_to_store
    from: store_sales
    to: store
    from_columns:
    - ss_store_sk
    to_columns:
    - s_store_sk
  datasets:
  - name: store_sales
    source: tpcds.public.store_sales
    description: Fact table containing all store sales transactions
    ai_context:
      synonyms:
      - sales transactions
      - store purchases
      - retail sales
      - POS data
    unique_keys:
    - - ss_item_sk
      - ss_ticket_number
    fields:
    - name: ss_sold_date_sk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ss_sold_date_sk
      datatype: Decimal
      dimension: {}
      description: Foreign key to date dimension
      ai_context:
        synonyms:
        - sale date
        - transaction date
    - name: ss_item_sk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ss_item_sk
      datatype: Decimal
      dimension: {}
      description: Foreign key to item dimension
      ai_context:
        synonyms:
        - product
        - item
    - name: ss_customer_sk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ss_customer_sk
      datatype: Decimal
      dimension: {}
      description: Foreign key to customer dimension
      ai_context:
        synonyms:
        - customer
        - buyer
    - name: ss_store_sk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ss_store_sk
      datatype: Decimal
      dimension: {}
      description: Foreign key to store dimension
      ai_context:
        synonyms:
        - store
        - location
    - name: ss_quantity
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ss_quantity
      datatype: Decimal
      dimension: {}
      description: Quantity of items sold
      ai_context:
        synonyms:
        - units sold
        - quantity
    - name: ss_sales_price
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ss_sales_price
      datatype: Decimal
      dimension: {}
      description: Sales price per unit
      ai_context:
        synonyms:
        - unit price
        - price
    - name: ss_ext_sales_price
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ss_ext_sales_price
      datatype: Decimal
      dimension: {}
      description: Extended sales price (quantity * price)
      ai_context:
        synonyms:
        - total price
        - line total
    - name: ss_net_profit
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ss_net_profit
      datatype: Decimal
      dimension: {}
      description: Net profit from the sale
      ai_context:
        synonyms:
        - profit
        - margin
    - name: ss_ticket_number
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ss_ticket_number
      datatype: String
      dimension: {}
      custom_extensions:
      - vendor_name: CUBE
        data: '{"_v": 1, "public": false}'
    primary_key:
    - ss_item_sk
    - ss_ticket_number
  - name: date_dim
    source: tpcds.public.date_dim
    description: Date dimension with calendar attributes
    ai_context:
      synonyms:
      - calendar
      - dates
      - time periods
    unique_keys:
    - - d_date_sk
    fields:
    - name: d_date_sk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: d_date_sk
      datatype: Decimal
      dimension: {}
      description: Surrogate key for date
    - name: d_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: d_date
      datatype: DateTime
      dimension:
        is_time: true
      description: Actual date value
      ai_context:
        synonyms:
        - date
        - calendar date
    - name: d_year
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: d_year
      datatype: Decimal
      dimension: {}
      description: Year
      ai_context:
        synonyms:
        - year
    - name: d_quarter_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: d_quarter_name
      datatype: DateTime
      dimension:
        is_time: true
      description: Quarter name (e.g., 2024Q1)
      ai_context:
        synonyms:
        - quarter
        - fiscal quarter
    - name: d_month_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: d_month_name
      datatype: DateTime
      dimension:
        is_time: true
      description: Month name
      ai_context:
        synonyms:
        - month
    primary_key:
    - d_date_sk
  - name: customer
    source: tpcds.public.customer
    description: Customer dimension with demographic information
    ai_context:
      synonyms:
      - customers
      - shoppers
      - buyers
    unique_keys:
    - - c_customer_sk
    fields:
    - name: c_customer_sk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: c_customer_sk
      datatype: Decimal
      dimension: {}
      description: Surrogate key for customer
    - name: c_customer_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: c_customer_id
      datatype: String
      dimension: {}
      description: Business key for customer
      ai_context:
        synonyms:
        - customer ID
        - customer number
    - name: c_first_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: c_first_name
      datatype: String
      dimension: {}
      description: Customer first name
    - name: c_last_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: c_last_name
      datatype: String
      dimension: {}
      description: Customer last name
    - name: customer_full_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: c_first_name || ' ' || c_last_name
      datatype: String
      dimension: {}
      description: Customer full name (computed field)
      ai_context:
        synonyms:
        - full name
        - customer name
    - name: c_email_address
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: c_email_address
      datatype: String
      dimension: {}
      description: Customer email address
      ai_context:
        synonyms:
        - email
        - contact
    primary_key:
    - c_customer_sk
  - name: item
    source: tpcds.public.item
    description: Item/Product dimension with product attributes
    ai_context:
      synonyms:
      - products
      - items
      - merchandise
    unique_keys:
    - - i_item_sk
    fields:
    - name: i_item_sk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: i_item_sk
      datatype: Decimal
      dimension: {}
      description: Surrogate key for item
    - name: i_item_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: i_item_id
      datatype: String
      dimension: {}
      description: Business key for item
      ai_context:
        synonyms:
        - item ID
        - product ID
        - SKU
    - name: i_item_desc
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: i_item_desc
      datatype: String
      dimension: {}
      description: Item description
      ai_context:
        synonyms:
        - product description
        - item name
    - name: i_brand
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: i_brand
      datatype: String
      dimension: {}
      description: Brand name
      ai_context:
        synonyms:
        - brand
        - manufacturer
    - name: i_category
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: i_category
      datatype: String
      dimension: {}
      description: Item category
      ai_context:
        synonyms:
        - product category
        - department
    - name: i_current_price
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: i_current_price
      datatype: Decimal
      dimension: {}
      description: Current price of the item
      ai_context:
        synonyms:
        - price
        - list price
    primary_key:
    - i_item_sk
  - name: store
    source: tpcds.public.store
    description: Store dimension with location and store attributes
    ai_context:
      synonyms:
      - stores
      - retail locations
      - branches
    unique_keys:
    - - s_store_id
    fields:
    - name: s_store_sk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: s_store_sk
      datatype: Decimal
      dimension: {}
      description: Surrogate key for store
    - name: s_store_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: s_store_id
      datatype: String
      dimension: {}
      description: Business key for store
      ai_context:
        synonyms:
        - store ID
        - store number
    - name: s_store_name
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: s_store_name
      datatype: String
      dimension: {}
      description: Store name
      ai_context:
        synonyms:
        - store name
        - location name
    - name: s_city
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: s_city
      datatype: String
      dimension: {}
      description: City where store is located
      ai_context:
        synonyms:
        - city
        - location
    - name: s_state
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: s_state
      datatype: String
      dimension: {}
      description: State where store is located
      ai_context:
        synonyms:
        - state
        - region
    - name: s_number_employees
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: s_number_employees
      datatype: Decimal
      dimension: {}
      description: Number of employees at the store
      ai_context:
        synonyms:
        - employee count
        - staff size
    primary_key:
    - s_store_sk
  metrics:
  - name: total_sales
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(store_sales.ss_ext_sales_price)
    description: Total sales revenue across all transactions
    ai_context:
      synonyms:
      - total revenue
      - gross sales
      - sales amount
  - name: total_profit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(store_sales.ss_net_profit)
    description: Total net profit from store sales
    ai_context:
      synonyms:
      - net profit
      - total earnings
      - profit
  - name: customer_lifetime_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(store_sales.ss_ext_sales_price) / COUNT(DISTINCT customer.c_customer_sk)
    description: Average lifetime sales value per customer
    ai_context:
      synonyms:
      - CLV
      - LTV
      - customer value
      - lifetime revenue
  - name: sales_by_brand
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(store_sales.ss_ext_sales_price)
    description: Total sales by brand (requires grouping by item.i_brand)
    ai_context:
      synonyms:
      - brand sales
      - brand performance
      - brand revenue
  - name: store_productivity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(store_sales.ss_ext_sales_price) / NULLIF(SUM(store.s_number_employees),
          0)
    description: Sales per employee across stores
    ai_context:
      synonyms:
      - sales per employee
      - employee productivity
      - revenue per employee
  custom_extensions:
  - vendor_name: SALESFORCE
    data: |
      {
        "tableau_workbook_id": "tpcds_retail_dashboard",
        "einstein_enabled": true,
        "crm_sync": {
          "enabled": true,
          "sync_frequency": "daily",
          "customer_mapping": "customer.c_customer_id -> Account.AccountNumber"
        },
        "tableau_semantics": {
          "published": true,
          "version": "0.1.1"
        }
      }
  - vendor_name: DBT
    data: '{"project_name": "tpcds_analytics", "models_path": "models/semantic"}'
