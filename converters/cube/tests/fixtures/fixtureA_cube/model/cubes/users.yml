# The dimension cube: sits on the one side of the join, so it is exposed to row
# multiplication -- both of its measures are deliberately fan-out-safe (a bare
# `count`, which maps to COUNT(DISTINCT <pk>), and a count_distinct). Also
# exercises a `sql`-defined cube, a geo dimension (which splits into two Ossie
# fields), and a segment (which has no Ossie form and rides in the stash).
cubes:
  - name: users
    sql: SELECT * FROM public.users WHERE deleted_at IS NULL
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: city
        sql: city
        type: string
      - name: location
        type: geo
        latitude:
          sql: "{CUBE}.lat"
        longitude:
          sql: "{CUBE}.lon"
    measures:
      - name: count
        type: count
      - name: cities
        sql: "{CUBE}.city"
        type: count_distinct
    segments:
      - name: active
        sql: "{CUBE}.status = 'active'"
