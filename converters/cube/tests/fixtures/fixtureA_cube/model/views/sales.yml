# The sole view, so it is the mapped one: its name, description, and
# meta.ai_context become the Ossie model's. The `cubes:` curation has no Ossie
# form and round-trips through the model-level stash.
views:
  - name: sales
    description: Sales overview
    meta:
      ai_context: >
        Primary view for revenue analysis. Use it for any question about
        sales, orders, or customer spend.
    cubes:
      - join_path: orders
        includes: "*"
      - join_path: orders.users
        includes:
          - city
