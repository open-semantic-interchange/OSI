# Time dimensions: custom granularities, and the `type: time` <-> `is_time` mapping.
cubes:
  - name: events
    sql_table: shop.public.events
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: occurred_at
        sql: occurred_at
        type: time
        granularities:
          - name: fiscal_year
            interval: 1 year
            offset: 3 months
          - name: sunday_week
            interval: 1 week
            origin: '2024-01-07'
      - name: recorded_on
        sql: recorded_on
        type: time
    measures:
      - name: count
        type: count
