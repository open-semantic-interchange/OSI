# A Cube primary key can be an expression. Ossie's `primary_key` names columns, so the
# only name there is to carry is the dimension's -- which export must put the key back
# on rather than synthesizing a dimension reading a column of that name.
cubes:
  - name: order_lines
    sql_table: shop.public.order_lines
    dimensions:
      - name: line_key
        sql: "CONCAT({CUBE}.tenant_id, '-', {CUBE}.line_no)"
        type: string
        primary_key: true
      - name: tenant_id
        sql: tenant_id
        type: number
      - name: line_no
        sql: line_no
        type: number
    measures:
      - name: count
        type: count
      - name: quantity
        sql: quantity
        type: sum
