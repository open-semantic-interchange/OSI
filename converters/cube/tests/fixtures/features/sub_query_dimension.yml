# A `sub_query` dimension reads a *measure* of another cube, which Cube resolves by
# aggregating in a subquery. An Ossie field expression is dataset-scoped SQL over
# columns, so the reference survives as text and is reported.
cubes:
  - name: products
    sql_table: shop.public.products
    joins:
      - name: orders
        sql: "{CUBE}.id = {orders}.product_id"
        relationship: one_to_many
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: order_count
        sql: "{orders.count}"
        type: number
        sub_query: true
  - name: orders
    sql_table: shop.public.orders
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: product_id
        sql: product_id
        type: number
    measures:
      - name: count
        type: count
