# Pre-aggregations are a Cube-only performance construct with no Ossie counterpart --
# legitimately so, which is why they are stashed rather than approximated.
cubes:
  - name: orders
    sql_table: shop.public.orders
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: status
        sql: status
        type: string
      - name: created_at
        sql: created_at
        type: time
    measures:
      - name: count
        type: count
      - name: revenue
        sql: amount
        type: sum
    pre_aggregations:
      - name: main
        measures:
          - count
          - revenue
        dimensions:
          - status
        time_dimension: created_at
        granularity: day
        refresh_key:
          every: 1 hour
      - name: rollup_only
        type: rollup
        measures:
          - revenue
        dimensions:
          - status
