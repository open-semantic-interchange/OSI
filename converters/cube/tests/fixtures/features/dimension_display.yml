# Presentation and masking metadata Ossie has no field for. All of it is Cube-specific
# and rides in the stash, so what this fixture pins is that none of it is lost.
cubes:
  - name: orders
    sql_table: shop.public.orders
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: amount
        sql: amount
        type: number
        format: currency
        currency: USD
        meta:
          note: shown in the order list
      - name: status
        sql: status
        type: string
        title: Order Status
        description: Current fulfilment state
        order: asc
      - name: avatar
        sql: avatar_url
        type: string
        format: imageUrl
      - name: secret_code
        sql: secret_code
        type: string
        mask:
          sql: "'****'"
      - name: internal_note
        sql: internal_note
        type: string
        public: false
    measures:
      - name: count
        type: count
