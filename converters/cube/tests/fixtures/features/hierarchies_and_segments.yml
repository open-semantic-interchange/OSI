# Hierarchies and segments: both Cube-only, both stashed and restored verbatim.
cubes:
  - name: users
    sql_table: shop.public.users
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: country
        sql: country
        type: string
      - name: city
        sql: city
        type: string
    hierarchies:
      - name: geography
        title: Where they are
        levels:
          - country
          - city
    segments:
      - name: active
        sql: "{CUBE}.status = 'active'"
        description: Not deleted
    measures:
      - name: count
        type: count
