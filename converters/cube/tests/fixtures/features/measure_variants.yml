# Measure shapes beyond a plain aggregate. `rolling_window` and `multi_stage` have no
# static Ossie expression at all, so they ride on the dataset stash with their original
# positions and come back interleaved with the measures rebuilt from metrics.
cubes:
  - name: sales
    sql_table: shop.public.sales
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: region
        sql: region
        type: string
      - name: sold_at
        sql: sold_at
        type: time
    measures:
      - name: count
        type: count
      - name: revenue
        sql: amount
        type: sum
        format: currency
        currency: USD
        drill_members:
          - id
          - region
      - name: completed_revenue
        sql: amount
        type: sum
        filters:
          - sql: "{CUBE}.status = 'completed'"
      - name: revenue_last_3_months
        sql: amount
        type: sum
        rolling_window:
          trailing: 3 month
      - name: revenue_by_region
        sql: "{revenue}"
        type: number
        multi_stage: true
        group_by:
          - region
      - name: revenue_prior_year
        sql: amount
        type: sum
        multi_stage: true
        time_shift:
          - time_dimension: sold_at
            interval: 1 year
            type: prior
