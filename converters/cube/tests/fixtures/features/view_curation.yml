# A view is where the Ossie model boundary lives, and its curation -- prefixes,
# aliases, includes/excludes, folders -- has no Ossie form. It is stashed verbatim.
cubes:
  - name: orders
    sql_table: shop.public.orders
    joins:
      - name: users
        sql: "{CUBE}.user_id = {users}.id"
        relationship: many_to_one
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: user_id
        sql: user_id
        type: number
      - name: status
        sql: status
        type: string
    measures:
      - name: count
        type: count
  - name: users
    sql_table: shop.public.users
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: city
        sql: city
        type: string
views:
  - name: sales
    description: Curated sales view
    meta:
      ai_context: Prefer this view for sales questions.
    cubes:
      - join_path: orders
        includes:
          - status
          - count
      - join_path: orders.users
        prefix: true
        includes:
          - city
    folders:
      - name: Attributes
        includes:
          - status
