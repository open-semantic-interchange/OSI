version: 2
updates:
  # GitHub Actions used by all CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Go CLI
  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"
    groups:
      go-modules:
        patterns:
          - "*"

  # Python projects (PEP 621 / hatchling)
  - package-ecosystem: "pip"
    directories:
      - "/python"
      - "/converters/dbt"
      - "/converters/databricks"
      - "/converters/gooddata"
      - "/converters/honeydew"
      - "/converters/omni"
      - "/converters/orionbelt"
      - "/converters/snowflake"
      - "/converters/wisdom"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Maven / Java converters
  - package-ecosystem: "maven"
    directories:
      - "/converters/polaris"
      - "/converters/salesforce"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
