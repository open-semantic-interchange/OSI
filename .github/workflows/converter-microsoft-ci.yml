name: Converters Microsoft CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'converters/microsoft/**'
      - 'core-spec/osi-schema.json'
      - '.github/workflows/converter-microsoft-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'converters/microsoft/**'
      - 'core-spec/osi-schema.json'
      - '.github/workflows/converter-microsoft-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Sync dependencies
        working-directory: converters/microsoft
        run: |
          uv sync

      - name: Lint
        working-directory: converters/microsoft
        run: |
          uv run ruff check .

      - name: Unit Tests
        working-directory: converters/microsoft
        run: |
          uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Round trip through the installed CLI
        working-directory: converters/microsoft
        run: |
          uv run ossie-microsoft import -q -i tests/fixtures/sales_model.bim -o rt.yaml
          uv run ossie-microsoft export -q -i rt.yaml -o rt.bim
          test -s rt.yaml && test -s rt.bim

      - name: Output validates against the core spec
        working-directory: converters/microsoft
        run: |
          uv run --script ../../validation/validate.py rt.yaml

  tom-structural-validation:
    name: Optional TOM structural validation
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Install uv
        run: python -m pip install uv

      - name: Install optional TOM dependencies
        working-directory: converters/microsoft
        run: |
          uv sync --extra tom
          uv run python scripts/restore_tom.py

      - name: Run TOM structural validation tests
        working-directory: converters/microsoft
        run: |
          uv run pytest tests/test_tom_integration.py -v
