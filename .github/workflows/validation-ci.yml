name: Validation CI

on:
  push:
    branches: ["main"]
    paths:
      - "validation/**"
      - "core-spec/**"
      - "examples/tpcds_semantic_model.yaml"
      - ".github/workflows/validation-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "validation/**"
      - "core-spec/**"
      - "examples/tpcds_semantic_model.yaml"
      - ".github/workflows/validation-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Run duplicate-key validator tests
        run: uv run validation/test_validate.py

      - name: Run validation pytest tests
        run: uv run --with pytest --with pyyaml --with jsonschema -m pytest validation/tests/

      - name: Validate canonical example
        run: uv run validation/validate.py examples/tpcds_semantic_model.yaml
